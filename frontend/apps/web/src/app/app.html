<a
	href="#main-content"
	class="top-3 left-3 -translate-y-24 rounded-md bg-background px-4 py-2 text-sm text-foreground focus:translate-y-0 fixed z-50 border"
>
	Skip to content
</a>
<header class="top-0 h-16 bg-background/95 backdrop-blur-xs sticky z-30 border-b">
	<div class="max-w-7xl px-4 sm:px-6 gap-4 mx-auto flex h-full items-center justify-between">
		<a
			routerLink="/"
			aria-label="GameAtlas home"
			class="gap-3 rounded-lg ring-ring flex items-center outline-none focus-visible:ring-2"
		>
			<span
				class="size-9 rounded-xl bg-primary text-primary-foreground flex shrink-0 items-center justify-center"
				aria-hidden="true"
			>
				<ng-icon name="matMapRound" size="19" />
			</span>
			<span class="text-base font-semibold tracking-tight">GameAtlas</span>
		</a>
		<ui-theme-switcher
			[compact]="true"
			[value]="themeSettings.preference()"
			(valueChange)="themeSettings.preference.set($event)"
		/>
	</div>
</header>
<main id="main-content" tabindex="-1" class="flex flex-1 flex-col outline-none">
	<router-outlet />
</main>
