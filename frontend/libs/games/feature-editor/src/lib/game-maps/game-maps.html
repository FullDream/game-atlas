<div class="mb-5 gap-3 flex items-center justify-between">
	<h2 class="text-base font-semibold">Your game's maps ({{ context().maps.length }})</h2>
	<button ui-button type="button" variant="outline" disabled icon="matAddRound">Add map</button>
</div>
<div class="gap-4 sm:grid-cols-2 grid">
	@for (map of context().maps; track map.id) {
		<article class="min-w-0 rounded-lg overflow-hidden border">
			@if (map.preview; as image) {
				<ui-media-thumbnail class="aspect-33/20 w-full" [image]="image" />
			} @else {
				<div class="bg-muted text-muted-foreground flex aspect-33/20 items-center justify-center">
					<ng-icon name="matMapRound" size="32" aria-hidden="true" />
				</div>
			}
			<h3 class="p-3 font-medium truncate">{{ map.name }}</h3>
		</article>
	} @empty {
		<p class="text-sm text-muted-foreground" style="grid-column: 1 / -1">No maps yet.</p>
	}
</div>
