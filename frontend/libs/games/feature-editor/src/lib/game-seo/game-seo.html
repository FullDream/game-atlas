@let editor = context();

<h2 class="text-sm font-semibold">Search appearance</h2>
<p class="mt-2 text-sm text-muted-foreground">Customize how this game appears in search results. Coming soon.</p>
<div class="mt-6 max-w-xl gap-5 flex flex-col">
	<div>
		<label for="game-seo-title" class="mb-2 text-sm font-medium block">Page title</label>
		<input id="game-seo-title" hlmInput disabled [placeholder]="editor.gameName || 'Game title'" />
	</div>
	<div>
		<label for="game-seo-description" class="mb-2 text-sm font-medium block">Meta description</label>
		<textarea
			id="game-seo-description"
			disabled
			rows="3"
			placeholder="A short summary for search engines…"
			class="rounded-lg p-3 text-sm w-full resize-none border bg-transparent"
		></textarea>
	</div>
</div>
