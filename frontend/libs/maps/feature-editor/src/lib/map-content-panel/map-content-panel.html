<div class="h-10 px-3 md:hidden flex shrink-0 items-center justify-between border-b">
	<span class="text-sm font-semibold">Map content</span>
	<button
		ui-button
		type="button"
		variant="ghost"
		size="icon-sm"
		icon="matChevronLeftRound"
		aria-label="Close map content"
		hlmTooltip="Close map content"
		(click)="toggle()"
	></button>
</div>
@if (liveStatus() === 'stale' || liveStatus() === 'reconnecting') {
	<div class="p-3 gap-2 flex shrink-0 items-center justify-between border-b">
		<p class="text-xs text-muted-foreground" role="status">
			{{
				liveStatus() === 'reconnecting'
					? 'Reconnecting… Status may be out of date.'
					: 'Updates disconnected. Status may be out of date.'
			}}
		</p>
		@if (liveStatus() === 'stale') {
			<button ui-button variant="ghost" size="sm" icon="matRefreshRound" (click)="reconnectRequested.emit()">
				Reconnect
			</button>
		}
	</div>
}
<div hlmAccordion type="single" class="min-h-0 flex-1 overflow-hidden">
	<maps-styles
		[sectionOpen]="activeSection() === 'styles'"
		(sectionOpenChange)="setSection('styles', $event)"
		[gameId]="gameId()"
		[map]="map()"
		[(selectedStyleId)]="selectedStyleId"
		(styleSelected)="close()"
	/>
	<maps-categories
		[sectionOpen]="activeSection() === 'categories'"
		(sectionOpenChange)="setSection('categories', $event)"
		[gameId]="gameId()"
		[mapId]="map().id"
	/>
	<maps-markers
		[sectionOpen]="activeSection() === 'markers'"
		(sectionOpenChange)="setSection('markers', $event)"
		[markers]="markers.data() ?? []"
		[categories]="categoriesById()"
		[selectedId]="selectedId()"
		[pendingMarkerIds]="pendingMarkerIds()"
		[loading]="markers.isLoading()"
		[error]="markers.isError()"
		(markerSelected)="markerSelected.emit($event)"
		(retryRequested)="markers.refetch()"
	/>
	<maps-settings
		[gameId]="gameId()"
		[map]="map()"
		[sectionOpen]="activeSection() === 'settings'"
		(sectionOpenChange)="setSection('settings', $event)"
	/>
	<div aria-hidden="true" class="min-h-0 flex-1" [class.hidden]="activeSection() !== null"></div>
</div>
