schema: spec-driven

context: |
  GameAtlas is a platform for interactive video game maps.

  Backend:
  - ASP.NET Core
  - EF Core
  - SQLite initially; PostgreSQL is a future addition, not part of the initial scope
  - Layered monolith initially; consider separate modules when feature areas grow
  - DDD, Vertical Slice Architecture, and pragmatic Clean Architecture

  Architectural principles:
  - Separate domain logic from infrastructure.
  - Avoid generic repositories.
  - Avoid unnecessary abstractions.
  - Do not introduce microservices.
  - Keep implementations simple.
  - Do not invent business requirements.
  - Use PATCH with application/merge-patch+json (RFC 7396) for resource updates;
    do not use PUT. All mutable request fields are optional: omission preserves
    the current value, explicit null clears only nullable fields, objects merge
    recursively, and arrays are replaced as a whole.
  - Follow the HTTP updates conventions in AGENTS.md, including Optional<T>,
    atomic updates, and rejection of empty patches, unknown or read-only fields,
    and unsupported media types.
  - Follow AGENTS.md for implementation conventions, including feature organization,
    persistence access, mapping, validation, error handling, and migration execution.

rules:
  proposal:
    - Keep changes small and focused.
    - Explicitly state what is out of scope.
  design:
    - Explain significant architectural decisions.
    - Prefer existing patterns over new abstractions.
  tasks:
    - Break implementation into small verifiable tasks.
    - Do not include unrelated improvements.
